name: Build Turnip A6xx

on:
  workflow_dispatch:
    inputs:
      mesa_commit:
        description: "Full 40-char Mesa commit hash (leave empty for latest main)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ninja-build patchelf unzip curl flex bison zip \
            glslang-tools python3-pip pkg-config
          pip install --break-system-packages meson mako pyyaml packaging ply
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Turnip (A6xx, vanilla Mesa)
        env:
          VARIANT: a6xx
          MESA_COMMIT: ${{ inputs.mesa_commit }}
          BUILD_VERSION: "1.0"
        run: |
          chmod +x build_turnip_a6xx.sh
          ./build_turnip_a6xx.sh

      - name: Upload driver zip
        uses: actions/upload-artifact@v4
        with:
          name: turnip-a6xx
          path: turnip_workdir/*.zip
          if-no-files-found: error
